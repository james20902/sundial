[package]
name = "sundial"
version = "0.2.0"
description = "Telemetry visualizer/recorder for epoch flight computer software"
authors = ["sundial"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "sundial"

# The Tauri 2 convention: all real code lives in the lib so mobile/desktop
# entry points can share it; `main.rs` is a thin shim.
[lib]
name = "sundial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "http2"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
